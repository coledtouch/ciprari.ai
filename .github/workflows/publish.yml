name: write-and-publish

on:
  schedule:
    - cron: "0 13 * * 1,3,5"   # 9:00 AM Eastern (EDT) Mon/Wed/Fri — regular post
    - cron: "10 13 * * 0"      # 9:10 AM Eastern (EDT) Sunday — Rollout Report
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | post | rollout | stub (pipeline test, no API) | dry (real API, no publish)"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core >/dev/null 2>&1 || true

      - name: Write today's post (Claude + web search)
        id: write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = "stub" ]; then
            python3 writer/writer.py auto --stub
          elif [ "$MODE" = "dry" ]; then
            python3 writer/writer.py auto
          else
            python3 writer/writer.py "$MODE"
          fi

      - name: Build site
        run: python3 changelog-src/build_blog.py

      - name: Sanity-check output
        run: |
          test -s changelog-site/index.html
          test -s changelog-site/feed.xml
          grep -q "${{ steps.write.outputs.slug }}" changelog-site/feed.xml
          echo "feed contains ${{ steps.write.outputs.slug }}"

      # stub and dry runs stop here: nothing is deployed or committed
      - name: Deploy to Cloudflare
        if: ${{ github.event.inputs.mode != 'stub' && github.event.inputs.mode != 'dry' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ba46412ff1f79be9aef72d7f1895fd78
        run: npx wrangler@4 deploy --config wrangler.jsonc

      - name: IndexNow ping (non-fatal)
        if: ${{ github.event.inputs.mode != 'stub' && github.event.inputs.mode != 'dry' }}
        run: |
          curl -sf "https://api.indexnow.org/indexnow?url=https://changelog.ciprari.ai/${{ steps.write.outputs.slug }}&key=c01e0s1ndexn0w2026ciprari&keyLocation=https://changelog.ciprari.ai/c01e0s1ndexn0w2026ciprari.txt" || true

      - name: Commit the new post back to the repo
        if: ${{ github.event.inputs.mode != 'stub' && github.event.inputs.mode != 'dry' }}
        run: |
          git config user.name "coleos-writer"
          git config user.email "info@coenconstruction.com"
          git add changelog-src/posts_b.py
          git commit -m "post: ${{ steps.write.outputs.slug }}"
          git push
