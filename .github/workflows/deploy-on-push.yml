name: deploy-on-push

# Rebuild and publish changelog.ciprari.ai whenever the SOURCE changes on main —
# a merged PR or a direct push. The daily writer (publish.yml) commits with the
# built-in GITHUB_TOKEN, which never triggers other workflows, so its own push
# does not cause a second deploy here.

on:
  push:
    branches: [main]
    paths:
      - "changelog-src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-on-push.yml"

permissions:
  contents: read

concurrency:
  group: publish          # shared with publish.yml so the two never overlap
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core >/dev/null 2>&1 || true

      - name: Build site
        run: python3 changelog-src/build_blog.py

      - name: Sanity-check output
        run: |
          test -s changelog-site/index.html
          test -s changelog-site/feed.xml

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ba46412ff1f79be9aef72d7f1895fd78
        run: npx wrangler@4 deploy --config wrangler.jsonc
