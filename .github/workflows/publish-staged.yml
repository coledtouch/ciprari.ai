name: publish-staged

# Publishes posts the ColeOS Adviser staged from the Root Console.
# Dispatched by the coleos-api worker (/post-trigger) when Cole presses
# "Publish post". Pulls the staged posts, validates + appends them to
# posts_b.py, builds, deploys, pings IndexNow, and commits back.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What this publish is"
        required: false
        default: "console publish"

permissions:
  contents: write

concurrency:
  group: publish          # never overlaps the daily writer or deploy-on-push
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install pillow
          sudo apt-get install -y fonts-dejavu-core >/dev/null 2>&1 || true

      - name: Apply the staged posts
        id: apply
        env:
          COLEOS_ADMIN_TOKEN: ${{ secrets.COLEOS_ADMIN_TOKEN }}
        run: python3 writer/apply_staged.py

      - name: Build site
        if: ${{ steps.apply.outputs.skip != 'true' }}
        run: python3 changelog-src/build_blog.py

      - name: Sanity-check output
        if: ${{ steps.apply.outputs.skip != 'true' }}
        run: |
          test -s changelog-site/index.html
          test -s changelog-site/feed.xml
          grep -q "${{ steps.apply.outputs.slug }}" changelog-site/feed.xml
          echo "feed contains ${{ steps.apply.outputs.slug }}"

      - name: Deploy to Cloudflare
        if: ${{ steps.apply.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ba46412ff1f79be9aef72d7f1895fd78
        run: npx wrangler@4 deploy --config wrangler.jsonc

      - name: IndexNow ping (non-fatal)
        if: ${{ steps.apply.outputs.skip != 'true' }}
        run: |
          for s in ${{ steps.apply.outputs.slugs }}; do
            curl -sf "https://api.indexnow.org/indexnow?url=https://changelog.ciprari.ai/$s&key=c01e0s1ndexn0w2026ciprari&keyLocation=https://changelog.ciprari.ai/c01e0s1ndexn0w2026ciprari.txt" || true
          done

      - name: Commit the new post(s) back to the repo
        if: ${{ steps.apply.outputs.skip != 'true' }}
        run: |
          git config user.name "coleos-writer"
          git config user.email "info@coenconstruction.com"
          git add changelog-src/posts_b.py
          git commit -m "post: ${{ steps.apply.outputs.slugs }} (staged from the Root Console)"
          git push
